[package]
name = "mast-core"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
bincode = "1"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
thiserror = "2"
tracing = "0.1"
ulid = { version = "1", features = ["serde"] }
rust-stemmers = "1"
usearch = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[[bench]]
name = "benchmarks"
harness = false
