[package]
name = "mast-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
async-trait = "0.1"
mast-core = { path = "../mast-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
ulid = "1"

[build-dependencies]
cbindgen = "0.27"
