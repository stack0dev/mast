[package]
name = "mast-embed-openai"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
mast-core = { path = "../mast-core" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
