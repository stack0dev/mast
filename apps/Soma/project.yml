name: Soma
options:
  bundleIdPrefix: com.mast
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6"
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  Soma:
    type: application
    platform: macOS
    sources:
      - path: Soma
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mast.soma
        PRODUCT_NAME: Soma
        INFOPLIST_GENERATION_MODE: GeneratedByXcode
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        CODE_SIGN_ENTITLEMENTS: Soma/Soma.entitlements
        SWIFT_INCLUDE_PATHS:
          - "$(SRCROOT)/MastFFI/Sources/CMast"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/MastFFI/Sources/CMast/lib"
        OTHER_LDFLAGS:
          - "-lmast_ffi"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_PREVIEWS: "YES"
